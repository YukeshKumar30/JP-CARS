<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="favNavyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Clean rounded icon container -->
  <rect width="64" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Car front silhouette scaled for 64x64 -->
  <g transform="translate(32, 21) scale(0.38)">
    <!-- Wheels -->
    <path d="M -48 6 C -50 6 -52 9 -52 14 C -52 20 -50 24 -47 26 L -44 26 L -44 8 Z" fill="#0f172a" />
    <path d="M 48 6 C 50 6 52 9 52 14 C 52 20 50 24 47 26 L 44 26 L 44 8 Z" fill="#0f172a" />

    <!-- Side Mirrors -->
    <path d="M -38 -15 C -46 -18 -49 -12 -42 -8 C -39 -7 -36 -9 -35 -11 Z" fill="#1e293b" />
    <path d="M 38 -15 C 46 -18 49 -12 42 -8 C 39 -7 36 -9 35 -11 Z" fill="#1e293b" />

    <!-- Roof and Windshield Frame -->
    <path d="M -26 -28 C -18 -34 18 -34 26 -28 C 33 -23 41 -10 45 -3 C 32 -3 15 -1 0 -1 C -15 -1 -32 -3 -45 -3 C -41 -10 -33 -23 -26 -28 Z" fill="url(#favNavyGrad)" />

    <!-- Windshield -->
    <path d="M -23 -26 C -16 -31 16 -31 23 -26 C 29 -21 35 -10 38 -5 C 26 -4 13 -3 0 -3 C -13 -3 -26 -4 -38 -5 C -35 -10 -29 -21 -23 -26 Z" fill="#090d16" />
    <path d="M -18 -25 L -26 -6 L -20 -6 L -12 -25 Z" fill="#ffffff" opacity="0.25" />

    <!-- Hood & Body -->
    <path d="M -44 -3 C -34 -2 -18 0 0 0 C 18 0 34 -2 44 -3 C 48 -2 50 2 49 8 C 48 14 46 22 42 24 C 34 28 18 30 0 30 C -18 30 -34 28 -42 24 C -46 22 -48 14 -49 8 C -50 2 -48 -2 -44 -3 Z" fill="url(#favNavyGrad)" />

    <!-- Hood contour lines -->
    <path d="M -20 -2 C -16 6 -8 16 -4 19" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 20 -2 C 16 6 8 16 4 19" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Headlights -->
    <path d="M -39 2 C -32 2 -22 6 -17 10 C -22 12 -33 13 -40 10 C -42 7 -42 4 -39 2 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <path d="M -37 4 C -31 4 -23 7 -19 9" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 39 2 C 32 2 22 6 17 10 C 22 12 33 13 40 10 C 42 7 42 4 39 2 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <path d="M 37 4 C 31 4 23 7 19 9" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Lower Grill & Lip -->
    <path d="M -18 19 C -8 22 8 22 18 19 C 21 23 18 26 13 27 C 5 29 -5 29 -13 27 C -18 26 -21 23 -18 19 Z" fill="#020617" />
    <path d="M -38 22 C -24 28 0 31 38 22 C 32 32 -32 32 -38 22 Z" fill="#0f172a" />
  </g>

  <!-- Typography "JP CARS" for Favicon -->
  <text 
    x="32" 
    y="47" 
    fill="url(#favRedGrad)" 
    font-family="'Montserrat', 'Arial Black', sans-serif" 
    font-size="12.5" 
    font-weight="900" 
    letter-spacing="1.2" 
    text-anchor="middle"
  >JP CARS</text>

  <!-- Accent Subtitle Bar "KALLAKURICHI" -->
  <text 
    x="32" 
    y="56" 
    fill="#0f172a" 
    font-family="'Inter', Arial, sans-serif" 
    font-size="5" 
    font-weight="800" 
    letter-spacing="1.8" 
    text-anchor="middle"
  >PRE-OWNED</text>
</svg>